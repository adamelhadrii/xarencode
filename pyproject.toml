[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xarencode"
version = "0.1.0"
description = "A lean terminal coding agent for a local llama.cpp model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "adamelhadrii" }]
dependencies = ["rich>=13.7", "prompt_toolkit>=3.0.43"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/adamelhadrii/xarencode"
Repository = "https://github.com/adamelhadrii/xarencode"
Issues = "https://github.com/adamelhadrii/xarencode/issues"

[project.scripts]
xarencode = "xarencode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xarencode"]
